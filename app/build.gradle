plugins { id 'com.android.application' }

android {
    namespace 'com.myles.kotobafloat'
    bundle { language { enableSplit = false } }
    compileSdk 35
    defaultConfig {
        applicationId 'com.myles.kotobafloat'
        minSdk 26
        targetSdk 35
        versionCode 15
        versionName '1.10.0'
        testInstrumentationRunner 'com.myles.kotobafloat.SmokeTests'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { release { minifyEnabled false } }
    lint { abortOnError true }
}
